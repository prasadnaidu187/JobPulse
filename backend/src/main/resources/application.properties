spring.application.name=jobpulse

server.port=8080

# ==============================
# PostgreSQL Database
# ==============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobpulse}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ==============================
# Spring Boot Actuator
# ==============================
management.endpoints.web.exposure.include=health,info

# ==============================
# JWT Configuration
# ==============================
jobpulse.jwt.secret=${JWT_SECRET:dev-secret-key-for-local-testing-minimum-32-characters-long}
jobpulse.jwt.expiration-ms=3600000
